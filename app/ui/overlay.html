<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>open-transcribe recording</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }
  :root {
    --rec: #ff5c5c;
    --busy: #f5b84a;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
    font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-weight: 500;
  }
  body { display: flex; align-items: center; justify-content: center; }

  .pill {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 36px;
    padding: 0 14px 0 14px;
    border-radius: 18px;
    background: linear-gradient(180deg, #232323, #161616);
    border: 1px solid rgba(255, 255, 255, 0.11);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.35);
    animation: appear 0.18s ease-out;
  }
  @keyframes appear { from { opacity: 0; transform: translateY(6px) scale(0.96); } }

  .dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--rec);
    box-shadow: 0 0 8px var(--rec);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; box-shadow: none; } }

  .wave {
    position: relative;
    display: flex;
    align-items: center;
    gap: 2px;
    width: 72px;
    height: 22px;
  }
  .wave span {
    flex: 1;
    height: 2px;
    border-radius: 2px;
    background: #f2f2f2;
    transition: height 70ms linear;
  }
  /* While the text is made: a light sweeps along a thin line. */
  .shimmer {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 2px;
    margin-top: -1px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(245, 184, 74, 0.15) 20%, var(--busy) 50%, rgba(245, 184, 74, 0.15) 80%, transparent 100%);
    background-size: 200% 100%;
    animation: sweep 1.1s linear infinite;
  }
  @keyframes sweep { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  .time {
    flex: none;
    min-width: 30px;
    text-align: right;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: #b5b5b5;
  }

  /* While the microphone opens: a grey dot. Speak when it turns red. */
  .opening .dot { background: #6f6f6f; box-shadow: none; animation: none; }
  .opening .wave span { background: #555555; }
  .opening .time { color: #6f6f6f; }

  .busy .dot { background: var(--busy); box-shadow: 0 0 8px var(--busy); animation-duration: 0.7s; }
  .busy .wave span { visibility: hidden; }
  .busy .shimmer { display: block; }
  .busy .time { color: #6f6f6f; }

  .pill.error {
    width: calc(100% - 12px);
    height: auto;
    min-height: 36px;
    padding: 8px 14px;
    box-sizing: border-box;
    border-color: rgba(255, 92, 92, 0.5);
  }
  .error .dot { animation: none; }
  .error .wave, .error .time { display: none; }
  .message {
    min-width: 0;
    color: #ffb4b4;
    font-size: 12px;
    line-height: 16px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .message[hidden] { display: none; }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <span class="dot"></span>
    <div class="wave" id="wave"><div class="shimmer"></div></div>
    <span class="time" id="time">0:00</span>
    <span class="message" id="message" role="alert" hidden></span>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
