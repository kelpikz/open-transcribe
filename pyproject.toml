[project]
name = "codex-audio"
version = "0.1.0"
description = "Speech to text using your ChatGPT subscription, via the endpoint the Codex mic button uses"
requires-python = ">=3.10"
dependencies = [
    "aiortc>=1.9",
    "av>=12",
    "httpx>=0.27",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
]

[project.scripts]
codex-audio = "codex_audio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codex_audio"]
